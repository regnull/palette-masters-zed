<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#9a9994" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d2cab9">    <tspan fill="#9a9994">avg_loss</tspan> <tspan fill="#7d4932">=</tspan> <tspan fill="#9a9994">loss</tspan><tspan fill="#9a9994">.</tspan><tspan fill="#b59060">rolling</tspan><tspan fill="#9a9994">(</tspan><tspan fill="#9a9994">period</tspan><tspan fill="#9a9994">)</tspan><tspan fill="#9a9994">.</tspan><tspan fill="#b59060">mean</tspan><tspan fill="#9a9994">(</tspan><tspan fill="#9a9994">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#9a9994" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#9a9994" text-anchor="end">16</text>
