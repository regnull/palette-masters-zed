<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#9a9994" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d2cab9"><tspan fill="#9a9994">)</tspan> <tspan fill="#7d4932">-&gt;</tspan> <tspan fill="#b59773">pd</tspan><tspan fill="#9a9994">.</tspan><tspan fill="#b59060">Series</tspan><tspan fill="#9a9994">:</tspan></text>
