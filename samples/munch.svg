<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d2cab9">    <tspan fill="#9a9994">rsi</tspan> <tspan fill="#7d4932">=</tspan> <tspan fill="#d0a858">100.0</tspan> <tspan fill="#7d4932">-</tspan> <tspan fill="#9a9994">(</tspan><tspan fill="#d0a858">100.0</tspan> <tspan fill="#7d4932">/</tspan> <tspan fill="#9a9994">(</tspan><tspan fill="#d0a858">1.0</tspan> <tspan fill="#7d4932">+</tspan> <tspan fill="#9a9994">rs</tspan><tspan fill="#9a9994">)</tspan><tspan fill="#9a9994">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#9a9994" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#9a9994" text-anchor="end">19</text>
