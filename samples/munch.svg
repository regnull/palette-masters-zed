<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d2cab9"><tspan fill="#8890a8">import</tspan> <tspan fill="#9a9994">pandas</tspan> <tspan fill="#8890a8">as</tspan> <tspan fill="#9a9994">pd</tspan></text>
