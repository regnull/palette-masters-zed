<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d2cab9">    <tspan fill="#9a9994">result</tspan> <tspan fill="#7d4932">=</tspan> <tspan fill="#9a9994">calculate_rsi</tspan><tspan fill="#9a9994">(</tspan><tspan fill="#9a9994">close</tspan><tspan fill="#9a9994">,</tspan> <tspan fill="#9a9994">period</tspan><tspan fill="#7d4932">=</tspan><tspan fill="#d0a858">20</tspan><tspan fill="#9a9994">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#9a9994" text-anchor="end">26</text>
