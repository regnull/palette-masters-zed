<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d2cab9"><tspan fill="#8890a8">if</tspan> <tspan fill="#c8a870">__name__</tspan> <tspan fill="#7d4932">==</tspan> <tspan fill="#cf9f55">&quot;__main__&quot;</tspan><tspan fill="#9a9994">:</tspan></text>
