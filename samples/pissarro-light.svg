<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#726b63">Pissarro Light — Veiled Tawny</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935"><tspan fill="#726839">import</tspan> <tspan fill="#6c6258">pandas</tspan> <tspan fill="#726839">as</tspan> <tspan fill="#6c6258">pd</tspan></text>
<text x="48" y="98" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">2</text>
<text x="48" y="120" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">3</text>
<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935"><tspan fill="#726839">def</tspan> <tspan fill="#74572e">calculate_rsi</tspan><tspan fill="#7c756c">(</tspan></text>
<text x="48" y="142" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">4</text>
<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">prices</tspan><tspan fill="#7c756c">:</tspan> <tspan fill="#656d34">pd</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">Series</tspan><tspan fill="#7c756c">,</tspan></text>
<text x="48" y="164" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">5</text>
<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">period</tspan><tspan fill="#7c756c">:</tspan> <tspan fill="#656d34">int</tspan> <tspan fill="#5c4f40">=</tspan> <tspan fill="#7c6a3c">14</tspan><tspan fill="#7c756c">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935"><tspan fill="#7c756c">)</tspan> <tspan fill="#5c4f40">-&gt;</tspan> <tspan fill="#656d34">pd</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">Series</tspan><tspan fill="#7c756c">:</tspan></text>
<text x="48" y="208" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">7</text>
<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#7e6c4e">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
<text x="48" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">8</text>
<text x="60" y="230" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">delta</tspan> <tspan fill="#5c4f40">=</tspan> <tspan fill="#6c6258">prices</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">diff</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#7c756c">)</tspan></text>
<text x="48" y="252" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">9</text>
<text x="48" y="274" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">10</text>
<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">gain</tspan> <tspan fill="#5c4f40">=</tspan> <tspan fill="#6c6258">delta</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">clip</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#6c6258">lower</tspan><tspan fill="#5c4f40">=</tspan><tspan fill="#7c6a3c">0.0</tspan><tspan fill="#7c756c">)</tspan></text>
<text x="48" y="296" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">11</text>
<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">loss</tspan> <tspan fill="#5c4f40">=</tspan> <tspan fill="#7c756c">(</tspan><tspan fill="#5c4f40">-</tspan><tspan fill="#6c6258">delta</tspan><tspan fill="#7c756c">)</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">clip</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#6c6258">lower</tspan><tspan fill="#5c4f40">=</tspan><tspan fill="#7c6a3c">0.0</tspan><tspan fill="#7c756c">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">avg_gain</tspan> <tspan fill="#5c4f40">=</tspan> <tspan fill="#6c6258">gain</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">rolling</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#6c6258">period</tspan><tspan fill="#7c756c">)</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">mean</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#7c756c">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">avg_loss</tspan> <tspan fill="#5c4f40">=</tspan> <tspan fill="#6c6258">loss</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">rolling</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#6c6258">period</tspan><tspan fill="#7c756c">)</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">mean</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#7c756c">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">rs</tspan> <tspan fill="#5c4f40">=</tspan> <tspan fill="#6c6258">avg_gain</tspan> <tspan fill="#5c4f40">/</tspan> <tspan fill="#6c6258">avg_loss</tspan></text>
<text x="48" y="428" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">17</text>
<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">rsi</tspan> <tspan fill="#5c4f40">=</tspan> <tspan fill="#7c6a3c">100.0</tspan> <tspan fill="#5c4f40">-</tspan> <tspan fill="#7c756c">(</tspan><tspan fill="#7c6a3c">100.0</tspan> <tspan fill="#5c4f40">/</tspan> <tspan fill="#7c756c">(</tspan><tspan fill="#7c6a3c">1.0</tspan> <tspan fill="#5c4f40">+</tspan> <tspan fill="#6c6258">rs</tspan><tspan fill="#7c756c">)</tspan><tspan fill="#7c756c">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#726839">return</tspan> <tspan fill="#6c6258">rsi</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">rename</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#7e6c4e">&quot;RSI&quot;</tspan><tspan fill="#7c756c">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">20</text>
<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935"><tspan fill="#6c676a"># Example usage</tspan></text>
<text x="48" y="538" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">22</text>
<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935"><tspan fill="#726839">if</tspan> <tspan fill="#816a43">__name__</tspan> <tspan fill="#5c4f40">==</tspan> <tspan fill="#7e6c4e">&quot;__main__&quot;</tspan><tspan fill="#7c756c">:</tspan></text>
<text x="48" y="560" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">23</text>
<text x="60" y="560" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">data</tspan> <tspan fill="#5c4f40">=</tspan> <tspan fill="#6c6258">pd</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">read_csv</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#7e6c4e">&quot;prices.csv&quot;</tspan><tspan fill="#7c756c">)</tspan></text>
<text x="48" y="582" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">24</text>
<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">close</tspan> <tspan fill="#5c4f40">=</tspan> <tspan fill="#6c6258">data</tspan><tspan fill="#7c756c">[</tspan><tspan fill="#7e6c4e">&quot;close&quot;</tspan><tspan fill="#7c756c">]</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">astype</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#74572e">float</tspan><tspan fill="#7c756c">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#6c6258">result</tspan> <tspan fill="#5c4f40">=</tspan> <tspan fill="#6c6258">calculate_rsi</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#6c6258">close</tspan><tspan fill="#7c756c">,</tspan> <tspan fill="#6c6258">period</tspan><tspan fill="#5c4f40">=</tspan><tspan fill="#7c6a3c">20</tspan><tspan fill="#7c756c">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">26</text>
<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3935">    <tspan fill="#74572e">print</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#6c6258">result</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">dropna</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#7c756c">)</tspan><tspan fill="#7c756c">.</tspan><tspan fill="#746648">head</tspan><tspan fill="#7c756c">(</tspan><tspan fill="#7c6a3c">5</tspan><tspan fill="#7c756c">)</tspan><tspan fill="#7c756c">)</tspan></text>
<text x="48" y="648" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b63" text-anchor="end">27</text>
