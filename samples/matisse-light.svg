<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3a35">    <tspan fill="#6a6865">result</tspan> <tspan fill="#736b4d">=</tspan> <tspan fill="#6a6865">calculate_rsi</tspan><tspan fill="#7b7874">(</tspan><tspan fill="#6a6865">close</tspan><tspan fill="#7b7874">,</tspan> <tspan fill="#6a6865">period</tspan><tspan fill="#736b4d">=</tspan><tspan fill="#826932">20</tspan><tspan fill="#7b7874">)</tspan></text>
