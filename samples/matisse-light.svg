<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3a35">    <tspan fill="#6a6865">rs</tspan> <tspan fill="#736b4d">=</tspan> <tspan fill="#6a6865">avg_gain</tspan> <tspan fill="#736b4d">/</tspan> <tspan fill="#6a6865">avg_loss</tspan></text>
