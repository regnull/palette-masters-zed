<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#706e6a" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3a35"><tspan fill="#7b7874">)</tspan> <tspan fill="#736b4d">-&gt;</tspan> <tspan fill="#7f6d55">pd</tspan><tspan fill="#7b7874">.</tspan><tspan fill="#846647">Series</tspan><tspan fill="#7b7874">:</tspan></text>
