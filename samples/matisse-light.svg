<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3a35"><tspan fill="#51628b">if</tspan> <tspan fill="#707558">__name__</tspan> <tspan fill="#736b4d">==</tspan> <tspan fill="#876d38">&quot;__main__&quot;</tspan><tspan fill="#7b7874">:</tspan></text>
