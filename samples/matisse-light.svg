<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3a35">    <tspan fill="#6a6865">loss</tspan> <tspan fill="#736b4d">=</tspan> <tspan fill="#7b7874">(</tspan><tspan fill="#736b4d">-</tspan><tspan fill="#6a6865">delta</tspan><tspan fill="#7b7874">)</tspan><tspan fill="#7b7874">.</tspan><tspan fill="#846647">clip</tspan><tspan fill="#7b7874">(</tspan><tspan fill="#6a6865">lower</tspan><tspan fill="#736b4d">=</tspan><tspan fill="#826932">0.0</tspan><tspan fill="#7b7874">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#706e6a" text-anchor="end">12</text>
