<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#706e6a" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3a35">    <tspan fill="#6a6865">avg_loss</tspan> <tspan fill="#736b4d">=</tspan> <tspan fill="#6a6865">loss</tspan><tspan fill="#7b7874">.</tspan><tspan fill="#846647">rolling</tspan><tspan fill="#7b7874">(</tspan><tspan fill="#6a6865">period</tspan><tspan fill="#7b7874">)</tspan><tspan fill="#7b7874">.</tspan><tspan fill="#846647">mean</tspan><tspan fill="#7b7874">(</tspan><tspan fill="#7b7874">)</tspan></text>
