<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932"><tspan fill="#80642e">import</tspan> <tspan fill="#6a635a">pandas</tspan> <tspan fill="#80642e">as</tspan> <tspan fill="#6a635a">pd</tspan></text>
