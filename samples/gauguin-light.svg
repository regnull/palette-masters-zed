<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#6a635a">gain</tspan> <tspan fill="#645936">=</tspan> <tspan fill="#6a635a">delta</tspan><tspan fill="#80776c">.</tspan><tspan fill="#775e36">clip</tspan><tspan fill="#80776c">(</tspan><tspan fill="#6a635a">lower</tspan><tspan fill="#645936">=</tspan><tspan fill="#7e6a32">0.0</tspan><tspan fill="#80776c">)</tspan></text>
