<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#6a635a">prices</tspan><tspan fill="#80776c">:</tspan> <tspan fill="#8b5933">pd</tspan><tspan fill="#80776c">.</tspan><tspan fill="#775e36">Series</tspan><tspan fill="#80776c">,</tspan></text>
