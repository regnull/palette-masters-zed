<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#6a635a">loss</tspan> <tspan fill="#645936">=</tspan> <tspan fill="#80776c">(</tspan><tspan fill="#645936">-</tspan><tspan fill="#6a635a">delta</tspan><tspan fill="#80776c">)</tspan><tspan fill="#80776c">.</tspan><tspan fill="#775e36">clip</tspan><tspan fill="#80776c">(</tspan><tspan fill="#6a635a">lower</tspan><tspan fill="#645936">=</tspan><tspan fill="#7e6a32">0.0</tspan><tspan fill="#80776c">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#6a635a">avg_gain</tspan> <tspan fill="#645936">=</tspan> <tspan fill="#6a635a">gain</tspan><tspan fill="#80776c">.</tspan><tspan fill="#775e36">rolling</tspan><tspan fill="#80776c">(</tspan><tspan fill="#6a635a">period</tspan><tspan fill="#80776c">)</tspan><tspan fill="#80776c">.</tspan><tspan fill="#775e36">mean</tspan><tspan fill="#80776c">(</tspan><tspan fill="#80776c">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#6a635a">avg_loss</tspan> <tspan fill="#645936">=</tspan> <tspan fill="#6a635a">loss</tspan><tspan fill="#80776c">.</tspan><tspan fill="#775e36">rolling</tspan><tspan fill="#80776c">(</tspan><tspan fill="#6a635a">period</tspan><tspan fill="#80776c">)</tspan><tspan fill="#80776c">.</tspan><tspan fill="#775e36">mean</tspan><tspan fill="#80776c">(</tspan><tspan fill="#80776c">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#6a635a">rs</tspan> <tspan fill="#645936">=</tspan> <tspan fill="#6a635a">avg_gain</tspan> <tspan fill="#645936">/</tspan> <tspan fill="#6a635a">avg_loss</tspan></text>
