<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#72683a">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
<text x="48" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">8</text>
<text x="60" y="230" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#6a635a">delta</tspan> <tspan fill="#645936">=</tspan> <tspan fill="#6a635a">prices</tspan><tspan fill="#80776c">.</tspan><tspan fill="#775e36">diff</tspan><tspan fill="#80776c">(</tspan><tspan fill="#80776c">)</tspan></text>
