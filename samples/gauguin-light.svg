<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932"><tspan fill="#80642e">def</tspan> <tspan fill="#934923">calculate_rsi</tspan><tspan fill="#80776c">(</tspan></text>
