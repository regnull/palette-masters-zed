<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#6a635a">close</tspan> <tspan fill="#645936">=</tspan> <tspan fill="#6a635a">data</tspan><tspan fill="#80776c">[</tspan><tspan fill="#72683a">&quot;close&quot;</tspan><tspan fill="#80776c">]</tspan><tspan fill="#80776c">.</tspan><tspan fill="#775e36">astype</tspan><tspan fill="#80776c">(</tspan><tspan fill="#934923">float</tspan><tspan fill="#80776c">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#6a635a">result</tspan> <tspan fill="#645936">=</tspan> <tspan fill="#6a635a">calculate_rsi</tspan><tspan fill="#80776c">(</tspan><tspan fill="#6a635a">close</tspan><tspan fill="#80776c">,</tspan> <tspan fill="#6a635a">period</tspan><tspan fill="#645936">=</tspan><tspan fill="#7e6a32">20</tspan><tspan fill="#80776c">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">26</text>
