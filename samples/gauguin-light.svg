<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#6a635a">period</tspan><tspan fill="#80776c">:</tspan> <tspan fill="#8b5933">int</tspan> <tspan fill="#645936">=</tspan> <tspan fill="#7e6a32">14</tspan><tspan fill="#80776c">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932"><tspan fill="#80776c">)</tspan> <tspan fill="#645936">-&gt;</tspan> <tspan fill="#8b5933">pd</tspan><tspan fill="#80776c">.</tspan><tspan fill="#775e36">Series</tspan><tspan fill="#80776c">:</tspan></text>
