<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932"><tspan fill="#80642e">if</tspan> <tspan fill="#7e6d41">__name__</tspan> <tspan fill="#645936">==</tspan> <tspan fill="#72683a">&quot;__main__&quot;</tspan><tspan fill="#80776c">:</tspan></text>
