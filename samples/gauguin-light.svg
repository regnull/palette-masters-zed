<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3932">    <tspan fill="#80642e">return</tspan> <tspan fill="#6a635a">rsi</tspan><tspan fill="#80776c">.</tspan><tspan fill="#775e36">rename</tspan><tspan fill="#80776c">(</tspan><tspan fill="#72683a">&quot;RSI&quot;</tspan><tspan fill="#80776c">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#756d63" text-anchor="end">20</text>
