<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#726d5a">Van Gogh Light — Veiled Tawny</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f"><tspan fill="#4f6490">import</tspan> <tspan fill="#666a67">pandas</tspan> <tspan fill="#4f6490">as</tspan> <tspan fill="#666a67">pd</tspan></text>
<text x="48" y="98" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">2</text>
<text x="48" y="120" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">3</text>
<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f"><tspan fill="#4f6490">def</tspan> <tspan fill="#4e6544">calculate_rsi</tspan><tspan fill="#7d7862">(</tspan></text>
<text x="48" y="142" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">4</text>
<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">prices</tspan><tspan fill="#7d7862">:</tspan> <tspan fill="#926536">pd</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">Series</tspan><tspan fill="#7d7862">,</tspan></text>
<text x="48" y="164" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">5</text>
<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">period</tspan><tspan fill="#7d7862">:</tspan> <tspan fill="#926536">int</tspan> <tspan fill="#86683e">=</tspan> <tspan fill="#8f5c2d">14</tspan><tspan fill="#7d7862">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f"><tspan fill="#7d7862">)</tspan> <tspan fill="#86683e">-&gt;</tspan> <tspan fill="#926536">pd</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">Series</tspan><tspan fill="#7d7862">:</tspan></text>
<text x="48" y="208" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">7</text>
<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#83713b">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
<text x="48" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">8</text>
<text x="60" y="230" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">delta</tspan> <tspan fill="#86683e">=</tspan> <tspan fill="#666a67">prices</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">diff</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#7d7862">)</tspan></text>
<text x="48" y="252" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">9</text>
<text x="48" y="274" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">10</text>
<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">gain</tspan> <tspan fill="#86683e">=</tspan> <tspan fill="#666a67">delta</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">clip</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#666a67">lower</tspan><tspan fill="#86683e">=</tspan><tspan fill="#8f5c2d">0.0</tspan><tspan fill="#7d7862">)</tspan></text>
<text x="48" y="296" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">11</text>
<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">loss</tspan> <tspan fill="#86683e">=</tspan> <tspan fill="#7d7862">(</tspan><tspan fill="#86683e">-</tspan><tspan fill="#666a67">delta</tspan><tspan fill="#7d7862">)</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">clip</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#666a67">lower</tspan><tspan fill="#86683e">=</tspan><tspan fill="#8f5c2d">0.0</tspan><tspan fill="#7d7862">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">avg_gain</tspan> <tspan fill="#86683e">=</tspan> <tspan fill="#666a67">gain</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">rolling</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#666a67">period</tspan><tspan fill="#7d7862">)</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">mean</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#7d7862">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">avg_loss</tspan> <tspan fill="#86683e">=</tspan> <tspan fill="#666a67">loss</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">rolling</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#666a67">period</tspan><tspan fill="#7d7862">)</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">mean</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#7d7862">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">rs</tspan> <tspan fill="#86683e">=</tspan> <tspan fill="#666a67">avg_gain</tspan> <tspan fill="#86683e">/</tspan> <tspan fill="#666a67">avg_loss</tspan></text>
<text x="48" y="428" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">17</text>
<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">rsi</tspan> <tspan fill="#86683e">=</tspan> <tspan fill="#8f5c2d">100.0</tspan> <tspan fill="#86683e">-</tspan> <tspan fill="#7d7862">(</tspan><tspan fill="#8f5c2d">100.0</tspan> <tspan fill="#86683e">/</tspan> <tspan fill="#7d7862">(</tspan><tspan fill="#8f5c2d">1.0</tspan> <tspan fill="#86683e">+</tspan> <tspan fill="#666a67">rs</tspan><tspan fill="#7d7862">)</tspan><tspan fill="#7d7862">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#4f6490">return</tspan> <tspan fill="#666a67">rsi</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">rename</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#83713b">&quot;RSI&quot;</tspan><tspan fill="#7d7862">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">20</text>
<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f"><tspan fill="#666347"># Example usage</tspan></text>
<text x="48" y="538" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">22</text>
<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f"><tspan fill="#4f6490">if</tspan> <tspan fill="#7f7343">__name__</tspan> <tspan fill="#86683e">==</tspan> <tspan fill="#83713b">&quot;__main__&quot;</tspan><tspan fill="#7d7862">:</tspan></text>
<text x="48" y="560" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">23</text>
<text x="60" y="560" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">data</tspan> <tspan fill="#86683e">=</tspan> <tspan fill="#666a67">pd</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">read_csv</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#83713b">&quot;prices.csv&quot;</tspan><tspan fill="#7d7862">)</tspan></text>
<text x="48" y="582" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">24</text>
<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">close</tspan> <tspan fill="#86683e">=</tspan> <tspan fill="#666a67">data</tspan><tspan fill="#7d7862">[</tspan><tspan fill="#83713b">&quot;close&quot;</tspan><tspan fill="#7d7862">]</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">astype</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#4e6544">float</tspan><tspan fill="#7d7862">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#666a67">result</tspan> <tspan fill="#86683e">=</tspan> <tspan fill="#666a67">calculate_rsi</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#666a67">close</tspan><tspan fill="#7d7862">,</tspan> <tspan fill="#666a67">period</tspan><tspan fill="#86683e">=</tspan><tspan fill="#8f5c2d">20</tspan><tspan fill="#7d7862">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">26</text>
<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c392f">    <tspan fill="#4e6544">print</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#666a67">result</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">dropna</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#7d7862">)</tspan><tspan fill="#7d7862">.</tspan><tspan fill="#7f683e">head</tspan><tspan fill="#7d7862">(</tspan><tspan fill="#8f5c2d">5</tspan><tspan fill="#7d7862">)</tspan><tspan fill="#7d7862">)</tspan></text>
<text x="48" y="648" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d5a" text-anchor="end">27</text>
