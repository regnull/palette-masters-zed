<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931"><tspan fill="#626e5d">def</tspan> <tspan fill="#855332">calculate_rsi</tspan><tspan fill="#7c7769">(</tspan></text>
