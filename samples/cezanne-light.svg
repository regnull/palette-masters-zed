<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">prices</tspan><tspan fill="#7c7769">:</tspan> <tspan fill="#696d49">pd</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">Series</tspan><tspan fill="#7c7769">,</tspan></text>
<text x="48" y="164" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">5</text>
<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">period</tspan><tspan fill="#7c7769">:</tspan> <tspan fill="#696d49">int</tspan> <tspan fill="#846848">=</tspan> <tspan fill="#7f683e">14</tspan><tspan fill="#7c7769">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931"><tspan fill="#7c7769">)</tspan> <tspan fill="#846848">-&gt;</tspan> <tspan fill="#696d49">pd</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">Series</tspan><tspan fill="#7c7769">:</tspan></text>
<text x="48" y="208" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">7</text>
<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#826d3e">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
<text x="48" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">8</text>
<text x="60" y="230" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">delta</tspan> <tspan fill="#846848">=</tspan> <tspan fill="#696864">prices</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">diff</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#7c7769">)</tspan></text>
<text x="48" y="252" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">9</text>
<text x="48" y="274" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">10</text>
<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">gain</tspan> <tspan fill="#846848">=</tspan> <tspan fill="#696864">delta</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">clip</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#696864">lower</tspan><tspan fill="#846848">=</tspan><tspan fill="#7f683e">0.0</tspan><tspan fill="#7c7769">)</tspan></text>
<text x="48" y="296" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">11</text>
<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">loss</tspan> <tspan fill="#846848">=</tspan> <tspan fill="#7c7769">(</tspan><tspan fill="#846848">-</tspan><tspan fill="#696864">delta</tspan><tspan fill="#7c7769">)</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">clip</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#696864">lower</tspan><tspan fill="#846848">=</tspan><tspan fill="#7f683e">0.0</tspan><tspan fill="#7c7769">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">avg_gain</tspan> <tspan fill="#846848">=</tspan> <tspan fill="#696864">gain</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">rolling</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#696864">period</tspan><tspan fill="#7c7769">)</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">mean</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#7c7769">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">avg_loss</tspan> <tspan fill="#846848">=</tspan> <tspan fill="#696864">loss</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">rolling</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#696864">period</tspan><tspan fill="#7c7769">)</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">mean</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#7c7769">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">rs</tspan> <tspan fill="#846848">=</tspan> <tspan fill="#696864">avg_gain</tspan> <tspan fill="#846848">/</tspan> <tspan fill="#696864">avg_loss</tspan></text>
<text x="48" y="428" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">17</text>
<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">rsi</tspan> <tspan fill="#846848">=</tspan> <tspan fill="#7f683e">100.0</tspan> <tspan fill="#846848">-</tspan> <tspan fill="#7c7769">(</tspan><tspan fill="#7f683e">100.0</tspan> <tspan fill="#846848">/</tspan> <tspan fill="#7c7769">(</tspan><tspan fill="#7f683e">1.0</tspan> <tspan fill="#846848">+</tspan> <tspan fill="#696864">rs</tspan><tspan fill="#7c7769">)</tspan><tspan fill="#7c7769">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#626e5d">return</tspan> <tspan fill="#696864">rsi</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">rename</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#826d3e">&quot;RSI&quot;</tspan><tspan fill="#7c7769">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">20</text>
<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931"><tspan fill="#6c6c69"># Example usage</tspan></text>
<text x="48" y="538" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">22</text>
<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931"><tspan fill="#626e5d">if</tspan> <tspan fill="#756f55">__name__</tspan> <tspan fill="#846848">==</tspan> <tspan fill="#826d3e">&quot;__main__&quot;</tspan><tspan fill="#7c7769">:</tspan></text>
<text x="48" y="560" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">23</text>
<text x="60" y="560" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">data</tspan> <tspan fill="#846848">=</tspan> <tspan fill="#696864">pd</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">read_csv</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#826d3e">&quot;prices.csv&quot;</tspan><tspan fill="#7c7769">)</tspan></text>
<text x="48" y="582" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">24</text>
<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">close</tspan> <tspan fill="#846848">=</tspan> <tspan fill="#696864">data</tspan><tspan fill="#7c7769">[</tspan><tspan fill="#826d3e">&quot;close&quot;</tspan><tspan fill="#7c7769">]</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">astype</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#855332">float</tspan><tspan fill="#7c7769">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#696864">result</tspan> <tspan fill="#846848">=</tspan> <tspan fill="#696864">calculate_rsi</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#696864">close</tspan><tspan fill="#7c7769">,</tspan> <tspan fill="#696864">period</tspan><tspan fill="#846848">=</tspan><tspan fill="#7f683e">20</tspan><tspan fill="#7c7769">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">26</text>
<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931">    <tspan fill="#855332">print</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#696864">result</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">dropna</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#7c7769">)</tspan><tspan fill="#7c7769">.</tspan><tspan fill="#7c6640">head</tspan><tspan fill="#7c7769">(</tspan><tspan fill="#7f683e">5</tspan><tspan fill="#7c7769">)</tspan><tspan fill="#7c7769">)</tspan></text>
<text x="48" y="648" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">27</text>
