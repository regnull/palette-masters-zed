<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#726d60">Cézanne Light — Penumbral Tawny</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726d60" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3931"><tspan fill="#626e5d">import</tspan> <tspan fill="#696864">pandas</tspan> <tspan fill="#626e5d">as</tspan> <tspan fill="#696864">pd</tspan></text>
