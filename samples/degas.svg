<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8678" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#cec2ae"><tspan fill="#8e8678">)</tspan> <tspan fill="#977553">-&gt;</tspan> <tspan fill="#b28045">pd</tspan><tspan fill="#8e8678">.</tspan><tspan fill="#b89060">Series</tspan><tspan fill="#8e8678">:</tspan></text>
