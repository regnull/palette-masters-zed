<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#cec2ae">    <tspan fill="#aa9a83">close</tspan> <tspan fill="#977553">=</tspan> <tspan fill="#aa9a83">data</tspan><tspan fill="#8e8678">[</tspan><tspan fill="#ceb16a">&quot;close&quot;</tspan><tspan fill="#8e8678">]</tspan><tspan fill="#8e8678">.</tspan><tspan fill="#b89060">astype</tspan><tspan fill="#8e8678">(</tspan><tspan fill="#a8684a">float</tspan><tspan fill="#8e8678">)</tspan></text>
