<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8678" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8678" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#cec2ae">    <tspan fill="#c0985a">return</tspan> <tspan fill="#aa9a83">rsi</tspan><tspan fill="#8e8678">.</tspan><tspan fill="#b89060">rename</tspan><tspan fill="#8e8678">(</tspan><tspan fill="#ceb16a">&quot;RSI&quot;</tspan><tspan fill="#8e8678">)</tspan></text>
