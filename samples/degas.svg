<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#cec2ae"><tspan fill="#c0985a">if</tspan> <tspan fill="#c8b080">__name__</tspan> <tspan fill="#977553">==</tspan> <tspan fill="#ceb16a">&quot;__main__&quot;</tspan><tspan fill="#8e8678">:</tspan></text>
