<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#cec2ae">    <tspan fill="#aa9a83">gain</tspan> <tspan fill="#977553">=</tspan> <tspan fill="#aa9a83">delta</tspan><tspan fill="#8e8678">.</tspan><tspan fill="#b89060">clip</tspan><tspan fill="#8e8678">(</tspan><tspan fill="#aa9a83">lower</tspan><tspan fill="#977553">=</tspan><tspan fill="#d0b070">0.0</tspan><tspan fill="#8e8678">)</tspan></text>
