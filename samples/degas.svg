<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#cec2ae">    <tspan fill="#aa9a83">result</tspan> <tspan fill="#977553">=</tspan> <tspan fill="#aa9a83">calculate_rsi</tspan><tspan fill="#8e8678">(</tspan><tspan fill="#aa9a83">close</tspan><tspan fill="#8e8678">,</tspan> <tspan fill="#aa9a83">period</tspan><tspan fill="#977553">=</tspan><tspan fill="#d0b070">20</tspan><tspan fill="#8e8678">)</tspan></text>
