<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#cbc2ac"><tspan fill="#c49a47">if</tspan> <tspan fill="#b8a060">__name__</tspan> <tspan fill="#645936">==</tspan> <tspan fill="#8a7e46">&quot;__main__&quot;</tspan><tspan fill="#968c7f">:</tspan></text>
