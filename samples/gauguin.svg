<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#968c7f" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#cbc2ac"><tspan fill="#968c7f">)</tspan> <tspan fill="#645936">-&gt;</tspan> <tspan fill="#8e5b34">pd</tspan><tspan fill="#968c7f">.</tspan><tspan fill="#8e7040">Series</tspan><tspan fill="#968c7f">:</tspan></text>
