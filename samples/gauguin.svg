<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#cbc2ac"><tspan fill="#c49a47">import</tspan> <tspan fill="#968c7f">pandas</tspan> <tspan fill="#c49a47">as</tspan> <tspan fill="#968c7f">pd</tspan></text>
