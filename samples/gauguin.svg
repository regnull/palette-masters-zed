<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#968c7f" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#cbc2ac">    <tspan fill="#968c7f">avg_loss</tspan> <tspan fill="#645936">=</tspan> <tspan fill="#968c7f">loss</tspan><tspan fill="#968c7f">.</tspan><tspan fill="#8e7040">rolling</tspan><tspan fill="#968c7f">(</tspan><tspan fill="#968c7f">period</tspan><tspan fill="#968c7f">)</tspan><tspan fill="#968c7f">.</tspan><tspan fill="#8e7040">mean</tspan><tspan fill="#968c7f">(</tspan><tspan fill="#968c7f">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#968c7f" text-anchor="end">15</text>
