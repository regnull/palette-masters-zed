<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#cbc2ac">    <tspan fill="#968c7f">rsi</tspan> <tspan fill="#645936">=</tspan> <tspan fill="#c8a850">100.0</tspan> <tspan fill="#645936">-</tspan> <tspan fill="#968c7f">(</tspan><tspan fill="#c8a850">100.0</tspan> <tspan fill="#645936">/</tspan> <tspan fill="#968c7f">(</tspan><tspan fill="#c8a850">1.0</tspan> <tspan fill="#645936">+</tspan> <tspan fill="#968c7f">rs</tspan><tspan fill="#968c7f">)</tspan><tspan fill="#968c7f">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#968c7f" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#968c7f" text-anchor="end">19</text>
