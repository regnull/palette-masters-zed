<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#898071">Vermeer — Shadowed Bister</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2"><tspan fill="#7080a0">import</tspan> <tspan fill="#898071">pandas</tspan> <tspan fill="#7080a0">as</tspan> <tspan fill="#898071">pd</tspan></text>
<text x="48" y="98" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">2</text>
<text x="48" y="120" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">3</text>
<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2"><tspan fill="#7080a0">def</tspan> <tspan fill="#a1abbd">calculate_rsi</tspan><tspan fill="#898071">(</tspan></text>
<text x="48" y="142" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">4</text>
<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">prices</tspan><tspan fill="#898071">:</tspan> <tspan fill="#d3cec2">pd</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">Series</tspan><tspan fill="#898071">,</tspan></text>
<text x="48" y="164" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">5</text>
<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">period</tspan><tspan fill="#898071">:</tspan> <tspan fill="#d3cec2">int</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#c8a870">14</tspan><tspan fill="#898071">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2"><tspan fill="#898071">)</tspan> <tspan fill="#694f33">-&gt;</tspan> <tspan fill="#d3cec2">pd</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">Series</tspan><tspan fill="#898071">:</tspan></text>
<text x="48" y="208" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">7</text>
<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#bca06a">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
<text x="48" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">8</text>
<text x="60" y="230" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">delta</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#898071">prices</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">diff</tspan><tspan fill="#898071">(</tspan><tspan fill="#898071">)</tspan></text>
<text x="48" y="252" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">9</text>
<text x="48" y="274" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">10</text>
<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">gain</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#898071">delta</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">clip</tspan><tspan fill="#898071">(</tspan><tspan fill="#898071">lower</tspan><tspan fill="#694f33">=</tspan><tspan fill="#c8a870">0.0</tspan><tspan fill="#898071">)</tspan></text>
<text x="48" y="296" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">11</text>
<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">loss</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#898071">(</tspan><tspan fill="#694f33">-</tspan><tspan fill="#898071">delta</tspan><tspan fill="#898071">)</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">clip</tspan><tspan fill="#898071">(</tspan><tspan fill="#898071">lower</tspan><tspan fill="#694f33">=</tspan><tspan fill="#c8a870">0.0</tspan><tspan fill="#898071">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">avg_gain</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#898071">gain</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">rolling</tspan><tspan fill="#898071">(</tspan><tspan fill="#898071">period</tspan><tspan fill="#898071">)</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">mean</tspan><tspan fill="#898071">(</tspan><tspan fill="#898071">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">avg_loss</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#898071">loss</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">rolling</tspan><tspan fill="#898071">(</tspan><tspan fill="#898071">period</tspan><tspan fill="#898071">)</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">mean</tspan><tspan fill="#898071">(</tspan><tspan fill="#898071">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">rs</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#898071">avg_gain</tspan> <tspan fill="#694f33">/</tspan> <tspan fill="#898071">avg_loss</tspan></text>
<text x="48" y="428" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">17</text>
<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">rsi</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#c8a870">100.0</tspan> <tspan fill="#694f33">-</tspan> <tspan fill="#898071">(</tspan><tspan fill="#c8a870">100.0</tspan> <tspan fill="#694f33">/</tspan> <tspan fill="#898071">(</tspan><tspan fill="#c8a870">1.0</tspan> <tspan fill="#694f33">+</tspan> <tspan fill="#898071">rs</tspan><tspan fill="#898071">)</tspan><tspan fill="#898071">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#7080a0">return</tspan> <tspan fill="#898071">rsi</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">rename</tspan><tspan fill="#898071">(</tspan><tspan fill="#bca06a">&quot;RSI&quot;</tspan><tspan fill="#898071">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">20</text>
<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2"><tspan fill="#694f33"># Example usage</tspan></text>
<text x="48" y="538" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">22</text>
<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2"><tspan fill="#7080a0">if</tspan> <tspan fill="#b4a880">__name__</tspan> <tspan fill="#694f33">==</tspan> <tspan fill="#bca06a">&quot;__main__&quot;</tspan><tspan fill="#898071">:</tspan></text>
<text x="48" y="560" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">23</text>
<text x="60" y="560" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">data</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#898071">pd</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">read_csv</tspan><tspan fill="#898071">(</tspan><tspan fill="#bca06a">&quot;prices.csv&quot;</tspan><tspan fill="#898071">)</tspan></text>
<text x="48" y="582" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">24</text>
<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">close</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#898071">data</tspan><tspan fill="#898071">[</tspan><tspan fill="#bca06a">&quot;close&quot;</tspan><tspan fill="#898071">]</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">astype</tspan><tspan fill="#898071">(</tspan><tspan fill="#a1abbd">float</tspan><tspan fill="#898071">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#898071">result</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#898071">calculate_rsi</tspan><tspan fill="#898071">(</tspan><tspan fill="#898071">close</tspan><tspan fill="#898071">,</tspan> <tspan fill="#898071">period</tspan><tspan fill="#694f33">=</tspan><tspan fill="#c8a870">20</tspan><tspan fill="#898071">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">26</text>
<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#d3cec2">    <tspan fill="#a1abbd">print</tspan><tspan fill="#898071">(</tspan><tspan fill="#898071">result</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">dropna</tspan><tspan fill="#898071">(</tspan><tspan fill="#898071">)</tspan><tspan fill="#898071">.</tspan><tspan fill="#bca06a">head</tspan><tspan fill="#898071">(</tspan><tspan fill="#c8a870">5</tspan><tspan fill="#898071">)</tspan><tspan fill="#898071">)</tspan></text>
<text x="48" y="648" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#898071" text-anchor="end">27</text>
</svg>