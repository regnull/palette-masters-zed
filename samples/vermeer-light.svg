<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36"><tspan fill="#56627a">def</tspan> <tspan fill="#5c626c">calculate_rsi</tspan><tspan fill="#7d7567">(</tspan></text>
