<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#726b5e">Vermeer Light — Shadowed Bister</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36"><tspan fill="#56627a">import</tspan> <tspan fill="#686155">pandas</tspan> <tspan fill="#56627a">as</tspan> <tspan fill="#686155">pd</tspan></text>
