<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">loss</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#7d7567">(</tspan><tspan fill="#694f33">-</tspan><tspan fill="#686155">delta</tspan><tspan fill="#7d7567">)</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">clip</tspan><tspan fill="#7d7567">(</tspan><tspan fill="#686155">lower</tspan><tspan fill="#694f33">=</tspan><tspan fill="#7d6946">0.0</tspan><tspan fill="#7d7567">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">avg_gain</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#686155">gain</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">rolling</tspan><tspan fill="#7d7567">(</tspan><tspan fill="#686155">period</tspan><tspan fill="#7d7567">)</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">mean</tspan><tspan fill="#7d7567">(</tspan><tspan fill="#7d7567">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">avg_loss</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#686155">loss</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">rolling</tspan><tspan fill="#7d7567">(</tspan><tspan fill="#686155">period</tspan><tspan fill="#7d7567">)</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">mean</tspan><tspan fill="#7d7567">(</tspan><tspan fill="#7d7567">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">rs</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#686155">avg_gain</tspan> <tspan fill="#694f33">/</tspan> <tspan fill="#686155">avg_loss</tspan></text>
