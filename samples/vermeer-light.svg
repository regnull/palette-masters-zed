<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">rsi</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#7d6946">100.0</tspan> <tspan fill="#694f33">-</tspan> <tspan fill="#7d7567">(</tspan><tspan fill="#7d6946">100.0</tspan> <tspan fill="#694f33">/</tspan> <tspan fill="#7d7567">(</tspan><tspan fill="#7d6946">1.0</tspan> <tspan fill="#694f33">+</tspan> <tspan fill="#686155">rs</tspan><tspan fill="#7d7567">)</tspan><tspan fill="#7d7567">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#56627a">return</tspan> <tspan fill="#686155">rsi</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">rename</tspan><tspan fill="#7d7567">(</tspan><tspan fill="#7f6c48">&quot;RSI&quot;</tspan><tspan fill="#7d7567">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">20</text>
<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36"><tspan fill="#694f33"># Example usage</tspan></text>
<text x="48" y="538" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">22</text>
<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36"><tspan fill="#56627a">if</tspan> <tspan fill="#776f54">__name__</tspan> <tspan fill="#694f33">==</tspan> <tspan fill="#7f6c48">&quot;__main__&quot;</tspan><tspan fill="#7d7567">:</tspan></text>
<text x="48" y="560" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">23</text>
<text x="60" y="560" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">data</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#686155">pd</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">read_csv</tspan><tspan fill="#7d7567">(</tspan><tspan fill="#7f6c48">&quot;prices.csv&quot;</tspan><tspan fill="#7d7567">)</tspan></text>
<text x="48" y="582" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">24</text>
<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">close</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#686155">data</tspan><tspan fill="#7d7567">[</tspan><tspan fill="#7f6c48">&quot;close&quot;</tspan><tspan fill="#7d7567">]</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">astype</tspan><tspan fill="#7d7567">(</tspan><tspan fill="#5c626c">float</tspan><tspan fill="#7d7567">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">result</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#686155">calculate_rsi</tspan><tspan fill="#7d7567">(</tspan><tspan fill="#686155">close</tspan><tspan fill="#7d7567">,</tspan> <tspan fill="#686155">period</tspan><tspan fill="#694f33">=</tspan><tspan fill="#7d6946">20</tspan><tspan fill="#7d7567">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">26</text>
