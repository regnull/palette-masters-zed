<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">prices</tspan><tspan fill="#7d7567">:</tspan> <tspan fill="#77746e">pd</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">Series</tspan><tspan fill="#7d7567">,</tspan></text>
