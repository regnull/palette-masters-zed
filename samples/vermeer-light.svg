<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">period</tspan><tspan fill="#7d7567">:</tspan> <tspan fill="#77746e">int</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#7d6946">14</tspan><tspan fill="#7d7567">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36"><tspan fill="#7d7567">)</tspan> <tspan fill="#694f33">-&gt;</tspan> <tspan fill="#77746e">pd</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">Series</tspan><tspan fill="#7d7567">:</tspan></text>
<text x="48" y="208" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">7</text>
<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#7f6c48">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
<text x="48" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">8</text>
<text x="60" y="230" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">delta</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#686155">prices</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">diff</tspan><tspan fill="#7d7567">(</tspan><tspan fill="#7d7567">)</tspan></text>
<text x="48" y="252" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">9</text>
<text x="48" y="274" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b5e" text-anchor="end">10</text>
<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a36">    <tspan fill="#686155">gain</tspan> <tspan fill="#694f33">=</tspan> <tspan fill="#686155">delta</tspan><tspan fill="#7d7567">.</tspan><tspan fill="#7a6845">clip</tspan><tspan fill="#7d7567">(</tspan><tspan fill="#686155">lower</tspan><tspan fill="#694f33">=</tspan><tspan fill="#7d6946">0.0</tspan><tspan fill="#7d7567">)</tspan></text>
