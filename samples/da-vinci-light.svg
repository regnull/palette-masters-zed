<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#776e5d">Da Vinci Light — Veiled Tawny</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30"><tspan fill="#4a6674">import</tspan> <tspan fill="#775d3e">pandas</tspan> <tspan fill="#4a6674">as</tspan> <tspan fill="#775d3e">pd</tspan></text>
