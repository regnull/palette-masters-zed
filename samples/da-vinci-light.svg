<text x="48" y="120" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">3</text>
<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30"><tspan fill="#4a6674">def</tspan> <tspan fill="#4d626e">calculate_rsi</tspan><tspan fill="#827865">(</tspan></text>
<text x="48" y="142" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">4</text>
<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">prices</tspan><tspan fill="#827865">:</tspan> <tspan fill="#797160">pd</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">Series</tspan><tspan fill="#827865">,</tspan></text>
<text x="48" y="164" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">5</text>
<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">period</tspan><tspan fill="#827865">:</tspan> <tspan fill="#797160">int</tspan> <tspan fill="#736555">=</tspan> <tspan fill="#806a43">14</tspan><tspan fill="#827865">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30"><tspan fill="#827865">)</tspan> <tspan fill="#736555">-&gt;</tspan> <tspan fill="#797160">pd</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">Series</tspan><tspan fill="#827865">:</tspan></text>
<text x="48" y="208" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">7</text>
<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#876b3f">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
<text x="48" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">8</text>
<text x="60" y="230" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">delta</tspan> <tspan fill="#736555">=</tspan> <tspan fill="#775d3e">prices</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">diff</tspan><tspan fill="#827865">(</tspan><tspan fill="#827865">)</tspan></text>
<text x="48" y="252" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">9</text>
<text x="48" y="274" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">10</text>
<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">gain</tspan> <tspan fill="#736555">=</tspan> <tspan fill="#775d3e">delta</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">clip</tspan><tspan fill="#827865">(</tspan><tspan fill="#775d3e">lower</tspan><tspan fill="#736555">=</tspan><tspan fill="#806a43">0.0</tspan><tspan fill="#827865">)</tspan></text>
<text x="48" y="296" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">11</text>
<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">loss</tspan> <tspan fill="#736555">=</tspan> <tspan fill="#827865">(</tspan><tspan fill="#736555">-</tspan><tspan fill="#775d3e">delta</tspan><tspan fill="#827865">)</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">clip</tspan><tspan fill="#827865">(</tspan><tspan fill="#775d3e">lower</tspan><tspan fill="#736555">=</tspan><tspan fill="#806a43">0.0</tspan><tspan fill="#827865">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">avg_gain</tspan> <tspan fill="#736555">=</tspan> <tspan fill="#775d3e">gain</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">rolling</tspan><tspan fill="#827865">(</tspan><tspan fill="#775d3e">period</tspan><tspan fill="#827865">)</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">mean</tspan><tspan fill="#827865">(</tspan><tspan fill="#827865">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">avg_loss</tspan> <tspan fill="#736555">=</tspan> <tspan fill="#775d3e">loss</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">rolling</tspan><tspan fill="#827865">(</tspan><tspan fill="#775d3e">period</tspan><tspan fill="#827865">)</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">mean</tspan><tspan fill="#827865">(</tspan><tspan fill="#827865">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">rs</tspan> <tspan fill="#736555">=</tspan> <tspan fill="#775d3e">avg_gain</tspan> <tspan fill="#736555">/</tspan> <tspan fill="#775d3e">avg_loss</tspan></text>
<text x="48" y="428" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">17</text>
<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">rsi</tspan> <tspan fill="#736555">=</tspan> <tspan fill="#806a43">100.0</tspan> <tspan fill="#736555">-</tspan> <tspan fill="#827865">(</tspan><tspan fill="#806a43">100.0</tspan> <tspan fill="#736555">/</tspan> <tspan fill="#827865">(</tspan><tspan fill="#806a43">1.0</tspan> <tspan fill="#736555">+</tspan> <tspan fill="#775d3e">rs</tspan><tspan fill="#827865">)</tspan><tspan fill="#827865">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#4a6674">return</tspan> <tspan fill="#775d3e">rsi</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">rename</tspan><tspan fill="#827865">(</tspan><tspan fill="#876b3f">&quot;RSI&quot;</tspan><tspan fill="#827865">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">20</text>
<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30"><tspan fill="#776858"># Example usage</tspan></text>
<text x="48" y="538" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">22</text>
<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30"><tspan fill="#4a6674">if</tspan> <tspan fill="#796f50">__name__</tspan> <tspan fill="#736555">==</tspan> <tspan fill="#876b3f">&quot;__main__&quot;</tspan><tspan fill="#827865">:</tspan></text>
<text x="48" y="560" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">23</text>
<text x="60" y="560" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">data</tspan> <tspan fill="#736555">=</tspan> <tspan fill="#775d3e">pd</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">read_csv</tspan><tspan fill="#827865">(</tspan><tspan fill="#876b3f">&quot;prices.csv&quot;</tspan><tspan fill="#827865">)</tspan></text>
<text x="48" y="582" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">24</text>
<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">close</tspan> <tspan fill="#736555">=</tspan> <tspan fill="#775d3e">data</tspan><tspan fill="#827865">[</tspan><tspan fill="#876b3f">&quot;close&quot;</tspan><tspan fill="#827865">]</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">astype</tspan><tspan fill="#827865">(</tspan><tspan fill="#4d626e">float</tspan><tspan fill="#827865">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#775d3e">result</tspan> <tspan fill="#736555">=</tspan> <tspan fill="#775d3e">calculate_rsi</tspan><tspan fill="#827865">(</tspan><tspan fill="#775d3e">close</tspan><tspan fill="#827865">,</tspan> <tspan fill="#775d3e">period</tspan><tspan fill="#736555">=</tspan><tspan fill="#806a43">20</tspan><tspan fill="#827865">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#776e5d" text-anchor="end">26</text>
<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3e3b30">    <tspan fill="#4d626e">print</tspan><tspan fill="#827865">(</tspan><tspan fill="#775d3e">result</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">dropna</tspan><tspan fill="#827865">(</tspan><tspan fill="#827865">)</tspan><tspan fill="#827865">.</tspan><tspan fill="#7d6847">head</tspan><tspan fill="#827865">(</tspan><tspan fill="#806a43">5</tspan><tspan fill="#827865">)</tspan><tspan fill="#827865">)</tspan></text>
