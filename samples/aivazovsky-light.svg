<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#737069">Aivazovsky Light — Veiled Parchment</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37"><tspan fill="#5d6877">import</tspan> <tspan fill="#686a66">pandas</tspan> <tspan fill="#5d6877">as</tspan> <tspan fill="#686a66">pd</tspan></text>
<text x="48" y="98" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">2</text>
<text x="48" y="120" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">3</text>
<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37"><tspan fill="#5d6877">def</tspan> <tspan fill="#486371">calculate_rsi</tspan><tspan fill="#7d7a73">(</tspan></text>
<text x="48" y="142" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">4</text>
<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">prices</tspan><tspan fill="#7d7a73">:</tspan> <tspan fill="#8b643a">pd</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">Series</tspan><tspan fill="#7d7a73">,</tspan></text>
<text x="48" y="164" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">5</text>
<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">period</tspan><tspan fill="#7d7a73">:</tspan> <tspan fill="#8b643a">int</tspan> <tspan fill="#716b5a">=</tspan> <tspan fill="#7a6b44">14</tspan><tspan fill="#7d7a73">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37"><tspan fill="#7d7a73">)</tspan> <tspan fill="#716b5a">-&gt;</tspan> <tspan fill="#8b643a">pd</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">Series</tspan><tspan fill="#7d7a73">:</tspan></text>
<text x="48" y="208" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">7</text>
<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#817351">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
<text x="48" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">8</text>
<text x="60" y="230" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">delta</tspan> <tspan fill="#716b5a">=</tspan> <tspan fill="#686a66">prices</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">diff</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#7d7a73">)</tspan></text>
<text x="48" y="252" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">9</text>
<text x="48" y="274" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">10</text>
<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">gain</tspan> <tspan fill="#716b5a">=</tspan> <tspan fill="#686a66">delta</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">clip</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#686a66">lower</tspan><tspan fill="#716b5a">=</tspan><tspan fill="#7a6b44">0.0</tspan><tspan fill="#7d7a73">)</tspan></text>
<text x="48" y="296" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">11</text>
<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">loss</tspan> <tspan fill="#716b5a">=</tspan> <tspan fill="#7d7a73">(</tspan><tspan fill="#716b5a">-</tspan><tspan fill="#686a66">delta</tspan><tspan fill="#7d7a73">)</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">clip</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#686a66">lower</tspan><tspan fill="#716b5a">=</tspan><tspan fill="#7a6b44">0.0</tspan><tspan fill="#7d7a73">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">avg_gain</tspan> <tspan fill="#716b5a">=</tspan> <tspan fill="#686a66">gain</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">rolling</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#686a66">period</tspan><tspan fill="#7d7a73">)</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">mean</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#7d7a73">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">avg_loss</tspan> <tspan fill="#716b5a">=</tspan> <tspan fill="#686a66">loss</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">rolling</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#686a66">period</tspan><tspan fill="#7d7a73">)</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">mean</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#7d7a73">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">rs</tspan> <tspan fill="#716b5a">=</tspan> <tspan fill="#686a66">avg_gain</tspan> <tspan fill="#716b5a">/</tspan> <tspan fill="#686a66">avg_loss</tspan></text>
<text x="48" y="428" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">17</text>
<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">rsi</tspan> <tspan fill="#716b5a">=</tspan> <tspan fill="#7a6b44">100.0</tspan> <tspan fill="#716b5a">-</tspan> <tspan fill="#7d7a73">(</tspan><tspan fill="#7a6b44">100.0</tspan> <tspan fill="#716b5a">/</tspan> <tspan fill="#7d7a73">(</tspan><tspan fill="#7a6b44">1.0</tspan> <tspan fill="#716b5a">+</tspan> <tspan fill="#686a66">rs</tspan><tspan fill="#7d7a73">)</tspan><tspan fill="#7d7a73">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#5d6877">return</tspan> <tspan fill="#686a66">rsi</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">rename</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#817351">&quot;RSI&quot;</tspan><tspan fill="#7d7a73">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">20</text>
<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37"><tspan fill="#6a6658"># Example usage</tspan></text>
<text x="48" y="538" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">22</text>
<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37"><tspan fill="#5d6877">if</tspan> <tspan fill="#5c727c">__name__</tspan> <tspan fill="#716b5a">==</tspan> <tspan fill="#817351">&quot;__main__&quot;</tspan><tspan fill="#7d7a73">:</tspan></text>
<text x="48" y="560" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">23</text>
<text x="60" y="560" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">data</tspan> <tspan fill="#716b5a">=</tspan> <tspan fill="#686a66">pd</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">read_csv</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#817351">&quot;prices.csv&quot;</tspan><tspan fill="#7d7a73">)</tspan></text>
<text x="48" y="582" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">24</text>
<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">close</tspan> <tspan fill="#716b5a">=</tspan> <tspan fill="#686a66">data</tspan><tspan fill="#7d7a73">[</tspan><tspan fill="#817351">&quot;close&quot;</tspan><tspan fill="#7d7a73">]</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">astype</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#486371">float</tspan><tspan fill="#7d7a73">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#686a66">result</tspan> <tspan fill="#716b5a">=</tspan> <tspan fill="#686a66">calculate_rsi</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#686a66">close</tspan><tspan fill="#7d7a73">,</tspan> <tspan fill="#686a66">period</tspan><tspan fill="#716b5a">=</tspan><tspan fill="#7a6b44">20</tspan><tspan fill="#7d7a73">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">26</text>
<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3b3a37">    <tspan fill="#486371">print</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#686a66">result</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">dropna</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#7d7a73">)</tspan><tspan fill="#7d7a73">.</tspan><tspan fill="#796a46">head</tspan><tspan fill="#7d7a73">(</tspan><tspan fill="#7a6b44">5</tspan><tspan fill="#7d7a73">)</tspan><tspan fill="#7d7a73">)</tspan></text>
<text x="48" y="648" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#737069" text-anchor="end">27</text>
