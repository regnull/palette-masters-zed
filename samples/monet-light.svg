<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 664" width="680" height="664">
<rect width="680" height="664" rx="10" fill="#f7f7f7" />
<rect width="680" height="38" rx="10" fill="#f0f1f0" />
<rect y="28" width="680" height="10" fill="#f0f1f0" />
<line x1="0" y1="38" x2="680" y2="38" stroke="#d6d6d6" stroke-width="1" />
<circle cx="24" cy="19" r="6" fill="#ff5f57" />
<circle cx="44" cy="19" r="6" fill="#febc2e" />
<circle cx="64" cy="19" r="6" fill="#28c840" />
<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#6d6f6f">Monet Light — Veiled Parchment</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39"><tspan fill="#5d6a7c">import</tspan> <tspan fill="#6e685c">pandas</tspan> <tspan fill="#5d6a7c">as</tspan> <tspan fill="#6e685c">pd</tspan></text>
<text x="48" y="98" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">2</text>
<text x="48" y="120" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">3</text>
<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39"><tspan fill="#5d6a7c">def</tspan> <tspan fill="#4d6271">calculate_rsi</tspan><tspan fill="#787979">(</tspan></text>
<text x="48" y="142" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">4</text>
<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">prices</tspan><tspan fill="#787979">:</tspan> <tspan fill="#677450">pd</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">Series</tspan><tspan fill="#787979">,</tspan></text>
<text x="48" y="164" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">5</text>
<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">period</tspan><tspan fill="#787979">:</tspan> <tspan fill="#677450">int</tspan> <tspan fill="#6d727b">=</tspan> <tspan fill="#7e6942">14</tspan><tspan fill="#787979">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39"><tspan fill="#787979">)</tspan> <tspan fill="#6d727b">-&gt;</tspan> <tspan fill="#677450">pd</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">Series</tspan><tspan fill="#787979">:</tspan></text>
<text x="48" y="208" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">7</text>
<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#7f6b3f">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
<text x="48" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">8</text>
<text x="60" y="230" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">delta</tspan> <tspan fill="#6d727b">=</tspan> <tspan fill="#6e685c">prices</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">diff</tspan><tspan fill="#787979">(</tspan><tspan fill="#787979">)</tspan></text>
<text x="48" y="252" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">9</text>
<text x="48" y="274" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">10</text>
<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">gain</tspan> <tspan fill="#6d727b">=</tspan> <tspan fill="#6e685c">delta</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">clip</tspan><tspan fill="#787979">(</tspan><tspan fill="#6e685c">lower</tspan><tspan fill="#6d727b">=</tspan><tspan fill="#7e6942">0.0</tspan><tspan fill="#787979">)</tspan></text>
<text x="48" y="296" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">11</text>
<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">loss</tspan> <tspan fill="#6d727b">=</tspan> <tspan fill="#787979">(</tspan><tspan fill="#6d727b">-</tspan><tspan fill="#6e685c">delta</tspan><tspan fill="#787979">)</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">clip</tspan><tspan fill="#787979">(</tspan><tspan fill="#6e685c">lower</tspan><tspan fill="#6d727b">=</tspan><tspan fill="#7e6942">0.0</tspan><tspan fill="#787979">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">avg_gain</tspan> <tspan fill="#6d727b">=</tspan> <tspan fill="#6e685c">gain</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">rolling</tspan><tspan fill="#787979">(</tspan><tspan fill="#6e685c">period</tspan><tspan fill="#787979">)</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">mean</tspan><tspan fill="#787979">(</tspan><tspan fill="#787979">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">avg_loss</tspan> <tspan fill="#6d727b">=</tspan> <tspan fill="#6e685c">loss</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">rolling</tspan><tspan fill="#787979">(</tspan><tspan fill="#6e685c">period</tspan><tspan fill="#787979">)</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">mean</tspan><tspan fill="#787979">(</tspan><tspan fill="#787979">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">rs</tspan> <tspan fill="#6d727b">=</tspan> <tspan fill="#6e685c">avg_gain</tspan> <tspan fill="#6d727b">/</tspan> <tspan fill="#6e685c">avg_loss</tspan></text>
<text x="48" y="428" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">17</text>
<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">rsi</tspan> <tspan fill="#6d727b">=</tspan> <tspan fill="#7e6942">100.0</tspan> <tspan fill="#6d727b">-</tspan> <tspan fill="#787979">(</tspan><tspan fill="#7e6942">100.0</tspan> <tspan fill="#6d727b">/</tspan> <tspan fill="#787979">(</tspan><tspan fill="#7e6942">1.0</tspan> <tspan fill="#6d727b">+</tspan> <tspan fill="#6e685c">rs</tspan><tspan fill="#787979">)</tspan><tspan fill="#787979">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#5d6a7c">return</tspan> <tspan fill="#6e685c">rsi</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">rename</tspan><tspan fill="#787979">(</tspan><tspan fill="#7f6b3f">&quot;RSI&quot;</tspan><tspan fill="#787979">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">20</text>
<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39"><tspan fill="#6b6e6d"># Example usage</tspan></text>
<text x="48" y="538" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">22</text>
<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39"><tspan fill="#5d6a7c">if</tspan> <tspan fill="#7f684f">__name__</tspan> <tspan fill="#6d727b">==</tspan> <tspan fill="#7f6b3f">&quot;__main__&quot;</tspan><tspan fill="#787979">:</tspan></text>
<text x="48" y="560" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">23</text>
<text x="60" y="560" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">data</tspan> <tspan fill="#6d727b">=</tspan> <tspan fill="#6e685c">pd</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">read_csv</tspan><tspan fill="#787979">(</tspan><tspan fill="#7f6b3f">&quot;prices.csv&quot;</tspan><tspan fill="#787979">)</tspan></text>
<text x="48" y="582" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">24</text>
<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">close</tspan> <tspan fill="#6d727b">=</tspan> <tspan fill="#6e685c">data</tspan><tspan fill="#787979">[</tspan><tspan fill="#7f6b3f">&quot;close&quot;</tspan><tspan fill="#787979">]</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">astype</tspan><tspan fill="#787979">(</tspan><tspan fill="#4d6271">float</tspan><tspan fill="#787979">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#6e685c">result</tspan> <tspan fill="#6d727b">=</tspan> <tspan fill="#6e685c">calculate_rsi</tspan><tspan fill="#787979">(</tspan><tspan fill="#6e685c">close</tspan><tspan fill="#787979">,</tspan> <tspan fill="#6e685c">period</tspan><tspan fill="#6d727b">=</tspan><tspan fill="#7e6942">20</tspan><tspan fill="#787979">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">26</text>
<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#393a39">    <tspan fill="#4d6271">print</tspan><tspan fill="#787979">(</tspan><tspan fill="#6e685c">result</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">dropna</tspan><tspan fill="#787979">(</tspan><tspan fill="#787979">)</tspan><tspan fill="#787979">.</tspan><tspan fill="#626b4c">head</tspan><tspan fill="#787979">(</tspan><tspan fill="#7e6942">5</tspan><tspan fill="#787979">)</tspan><tspan fill="#787979">)</tspan></text>
<text x="48" y="648" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#6d6f6f" text-anchor="end">27</text>
</svg>