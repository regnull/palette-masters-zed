<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#8e9090">Monet — Veiled Parchment</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9"><tspan fill="#99adcb">import</tspan> <tspan fill="#b4aa96">pandas</tspan> <tspan fill="#99adcb">as</tspan> <tspan fill="#b4aa96">pd</tspan></text>
