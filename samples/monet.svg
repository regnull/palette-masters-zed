<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#b4aa96">close</tspan> <tspan fill="#999fac">=</tspan> <tspan fill="#b4aa96">data</tspan><tspan fill="#8e9090">[</tspan><tspan fill="#b4995a">&quot;close&quot;</tspan><tspan fill="#8e9090">]</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">astype</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#7b9eb5">float</tspan><tspan fill="#8e9090">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#b4aa96">result</tspan> <tspan fill="#999fac">=</tspan> <tspan fill="#b4aa96">calculate_rsi</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#b4aa96">close</tspan><tspan fill="#8e9090">,</tspan> <tspan fill="#b4aa96">period</tspan><tspan fill="#999fac">=</tspan><tspan fill="#c9a86a">20</tspan><tspan fill="#8e9090">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">26</text>
<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#7b9eb5">print</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#b4aa96">result</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">dropna</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#8e9090">)</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">head</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#c9a86a">5</tspan><tspan fill="#8e9090">)</tspan><tspan fill="#8e9090">)</tspan></text>
