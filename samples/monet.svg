<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#b4aa96">gain</tspan> <tspan fill="#999fac">=</tspan> <tspan fill="#b4aa96">delta</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">clip</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#b4aa96">lower</tspan><tspan fill="#999fac">=</tspan><tspan fill="#c9a86a">0.0</tspan><tspan fill="#8e9090">)</tspan></text>
