<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#b4aa96">period</tspan><tspan fill="#8e9090">:</tspan> <tspan fill="#9db07a">int</tspan> <tspan fill="#999fac">=</tspan> <tspan fill="#c9a86a">14</tspan><tspan fill="#8e9090">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9"><tspan fill="#8e9090">)</tspan> <tspan fill="#999fac">-&gt;</tspan> <tspan fill="#9db07a">pd</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">Series</tspan><tspan fill="#8e9090">:</tspan></text>
<text x="48" y="208" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">7</text>
<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#b4995a">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
