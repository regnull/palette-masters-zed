<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#b4aa96">prices</tspan><tspan fill="#8e9090">:</tspan> <tspan fill="#9db07a">pd</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">Series</tspan><tspan fill="#8e9090">,</tspan></text>
