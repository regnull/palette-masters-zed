<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#b4aa96">rsi</tspan> <tspan fill="#999fac">=</tspan> <tspan fill="#c9a86a">100.0</tspan> <tspan fill="#999fac">-</tspan> <tspan fill="#8e9090">(</tspan><tspan fill="#c9a86a">100.0</tspan> <tspan fill="#999fac">/</tspan> <tspan fill="#8e9090">(</tspan><tspan fill="#c9a86a">1.0</tspan> <tspan fill="#999fac">+</tspan> <tspan fill="#b4aa96">rs</tspan><tspan fill="#8e9090">)</tspan><tspan fill="#8e9090">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#99adcb">return</tspan> <tspan fill="#b4aa96">rsi</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">rename</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#b4995a">&quot;RSI&quot;</tspan><tspan fill="#8e9090">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">20</text>
<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9"><tspan fill="#747776"># Example usage</tspan></text>
<text x="48" y="538" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">22</text>
<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9"><tspan fill="#99adcb">if</tspan> <tspan fill="#ae8e6d">__name__</tspan> <tspan fill="#999fac">==</tspan> <tspan fill="#b4995a">&quot;__main__&quot;</tspan><tspan fill="#8e9090">:</tspan></text>
