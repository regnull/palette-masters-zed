<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#b4aa96">loss</tspan> <tspan fill="#999fac">=</tspan> <tspan fill="#8e9090">(</tspan><tspan fill="#999fac">-</tspan><tspan fill="#b4aa96">delta</tspan><tspan fill="#8e9090">)</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">clip</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#b4aa96">lower</tspan><tspan fill="#999fac">=</tspan><tspan fill="#c9a86a">0.0</tspan><tspan fill="#8e9090">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#b4aa96">avg_gain</tspan> <tspan fill="#999fac">=</tspan> <tspan fill="#b4aa96">gain</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">rolling</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#b4aa96">period</tspan><tspan fill="#8e9090">)</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">mean</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#8e9090">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#b4aa96">avg_loss</tspan> <tspan fill="#999fac">=</tspan> <tspan fill="#b4aa96">loss</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">rolling</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#b4aa96">period</tspan><tspan fill="#8e9090">)</tspan><tspan fill="#8e9090">.</tspan><tspan fill="#8d9a6d">mean</tspan><tspan fill="#8e9090">(</tspan><tspan fill="#8e9090">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e9090" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#c8cac9">    <tspan fill="#b4aa96">rs</tspan> <tspan fill="#999fac">=</tspan> <tspan fill="#b4aa96">avg_gain</tspan> <tspan fill="#999fac">/</tspan> <tspan fill="#b4aa96">avg_loss</tspan></text>
