<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac">    <tspan fill="#ae9473">prices</tspan><tspan fill="#8e8474">:</tspan> <tspan fill="#b17f45">pd</tspan><tspan fill="#8e8474">.</tspan><tspan fill="#bb8555">Series</tspan><tspan fill="#8e8474">,</tspan></text>
