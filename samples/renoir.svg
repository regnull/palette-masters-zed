<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac">    <tspan fill="#ae9473">period</tspan><tspan fill="#8e8474">:</tspan> <tspan fill="#b17f45">int</tspan> <tspan fill="#958174">=</tspan> <tspan fill="#d4a065">14</tspan><tspan fill="#8e8474">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8474" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac"><tspan fill="#8e8474">)</tspan> <tspan fill="#958174">-&gt;</tspan> <tspan fill="#b17f45">pd</tspan><tspan fill="#8e8474">.</tspan><tspan fill="#bb8555">Series</tspan><tspan fill="#8e8474">:</tspan></text>
