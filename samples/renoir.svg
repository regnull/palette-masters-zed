<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac"><tspan fill="#c8935a">import</tspan> <tspan fill="#ae9473">pandas</tspan> <tspan fill="#c8935a">as</tspan> <tspan fill="#ae9473">pd</tspan></text>
