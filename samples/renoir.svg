<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac">    <tspan fill="#ae9473">loss</tspan> <tspan fill="#958174">=</tspan> <tspan fill="#8e8474">(</tspan><tspan fill="#958174">-</tspan><tspan fill="#ae9473">delta</tspan><tspan fill="#8e8474">)</tspan><tspan fill="#8e8474">.</tspan><tspan fill="#bb8555">clip</tspan><tspan fill="#8e8474">(</tspan><tspan fill="#ae9473">lower</tspan><tspan fill="#958174">=</tspan><tspan fill="#d4a065">0.0</tspan><tspan fill="#8e8474">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8474" text-anchor="end">12</text>
