<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac">    <tspan fill="#ae9473">avg_gain</tspan> <tspan fill="#958174">=</tspan> <tspan fill="#ae9473">gain</tspan><tspan fill="#8e8474">.</tspan><tspan fill="#bb8555">rolling</tspan><tspan fill="#8e8474">(</tspan><tspan fill="#ae9473">period</tspan><tspan fill="#8e8474">)</tspan><tspan fill="#8e8474">.</tspan><tspan fill="#bb8555">mean</tspan><tspan fill="#8e8474">(</tspan><tspan fill="#8e8474">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8474" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac">    <tspan fill="#ae9473">avg_loss</tspan> <tspan fill="#958174">=</tspan> <tspan fill="#ae9473">loss</tspan><tspan fill="#8e8474">.</tspan><tspan fill="#bb8555">rolling</tspan><tspan fill="#8e8474">(</tspan><tspan fill="#ae9473">period</tspan><tspan fill="#8e8474">)</tspan><tspan fill="#8e8474">.</tspan><tspan fill="#bb8555">mean</tspan><tspan fill="#8e8474">(</tspan><tspan fill="#8e8474">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8474" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8474" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac">    <tspan fill="#ae9473">rs</tspan> <tspan fill="#958174">=</tspan> <tspan fill="#ae9473">avg_gain</tspan> <tspan fill="#958174">/</tspan> <tspan fill="#ae9473">avg_loss</tspan></text>
