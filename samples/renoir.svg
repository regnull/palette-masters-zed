<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac"><tspan fill="#c8935a">if</tspan> <tspan fill="#cc9e6e">__name__</tspan> <tspan fill="#958174">==</tspan> <tspan fill="#cfaf7b">&quot;__main__&quot;</tspan><tspan fill="#8e8474">:</tspan></text>
