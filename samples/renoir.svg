<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac">    <tspan fill="#ae9473">close</tspan> <tspan fill="#958174">=</tspan> <tspan fill="#ae9473">data</tspan><tspan fill="#8e8474">[</tspan><tspan fill="#cfaf7b">&quot;close&quot;</tspan><tspan fill="#8e8474">]</tspan><tspan fill="#8e8474">.</tspan><tspan fill="#bb8555">astype</tspan><tspan fill="#8e8474">(</tspan><tspan fill="#c86840">float</tspan><tspan fill="#8e8474">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8474" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac">    <tspan fill="#ae9473">result</tspan> <tspan fill="#958174">=</tspan> <tspan fill="#ae9473">calculate_rsi</tspan><tspan fill="#8e8474">(</tspan><tspan fill="#ae9473">close</tspan><tspan fill="#8e8474">,</tspan> <tspan fill="#ae9473">period</tspan><tspan fill="#958174">=</tspan><tspan fill="#d4a065">20</tspan><tspan fill="#8e8474">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8474" text-anchor="end">26</text>
<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac">    <tspan fill="#c86840">print</tspan><tspan fill="#8e8474">(</tspan><tspan fill="#ae9473">result</tspan><tspan fill="#8e8474">.</tspan><tspan fill="#bb8555">dropna</tspan><tspan fill="#8e8474">(</tspan><tspan fill="#8e8474">)</tspan><tspan fill="#8e8474">.</tspan><tspan fill="#bb8555">head</tspan><tspan fill="#8e8474">(</tspan><tspan fill="#d4a065">5</tspan><tspan fill="#8e8474">)</tspan><tspan fill="#8e8474">)</tspan></text>
