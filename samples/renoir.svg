<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8474" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8474" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac">    <tspan fill="#c8935a">return</tspan> <tspan fill="#ae9473">rsi</tspan><tspan fill="#8e8474">.</tspan><tspan fill="#bb8555">rename</tspan><tspan fill="#8e8474">(</tspan><tspan fill="#cfaf7b">&quot;RSI&quot;</tspan><tspan fill="#8e8474">)</tspan></text>
