<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#8e8474" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#ccbfac"><tspan fill="#7a7268"># Example usage</tspan></text>
