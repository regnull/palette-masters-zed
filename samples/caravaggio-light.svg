<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">rsi</tspan> <tspan fill="#67513b">=</tspan> <tspan fill="#7d6c42">100.0</tspan> <tspan fill="#67513b">-</tspan> <tspan fill="#7c7576">(</tspan><tspan fill="#7d6c42">100.0</tspan> <tspan fill="#67513b">/</tspan> <tspan fill="#7c7576">(</tspan><tspan fill="#7d6c42">1.0</tspan> <tspan fill="#67513b">+</tspan> <tspan fill="#676161">rs</tspan><tspan fill="#7c7576">)</tspan><tspan fill="#7c7576">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#7d6a40">return</tspan> <tspan fill="#676161">rsi</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">rename</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#83633f">&quot;RSI&quot;</tspan><tspan fill="#7c7576">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">20</text>
<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932"><tspan fill="#3f3025"># Example usage</tspan></text>
<text x="48" y="538" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">22</text>
<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932"><tspan fill="#7d6a40">if</tspan> <tspan fill="#816e3f">__name__</tspan> <tspan fill="#67513b">==</tspan> <tspan fill="#83633f">&quot;__main__&quot;</tspan><tspan fill="#7c7576">:</tspan></text>
<text x="48" y="560" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">23</text>
<text x="60" y="560" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">data</tspan> <tspan fill="#67513b">=</tspan> <tspan fill="#676161">pd</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">read_csv</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#83633f">&quot;prices.csv&quot;</tspan><tspan fill="#7c7576">)</tspan></text>
<text x="48" y="582" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">24</text>
<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">close</tspan> <tspan fill="#67513b">=</tspan> <tspan fill="#676161">data</tspan><tspan fill="#7c7576">[</tspan><tspan fill="#83633f">&quot;close&quot;</tspan><tspan fill="#7c7576">]</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">astype</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#7a5d30">float</tspan><tspan fill="#7c7576">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">result</tspan> <tspan fill="#67513b">=</tspan> <tspan fill="#676161">calculate_rsi</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#676161">close</tspan><tspan fill="#7c7576">,</tspan> <tspan fill="#676161">period</tspan><tspan fill="#67513b">=</tspan><tspan fill="#7d6c42">20</tspan><tspan fill="#7c7576">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">26</text>
<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#7a5d30">print</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#676161">result</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">dropna</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#7c7576">)</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">head</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#7d6c42">5</tspan><tspan fill="#7c7576">)</tspan><tspan fill="#7c7576">)</tspan></text>
