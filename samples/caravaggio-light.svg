<text x="48" y="120" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">3</text>
<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932"><tspan fill="#7d6a40">def</tspan> <tspan fill="#7a5d30">calculate_rsi</tspan><tspan fill="#7c7576">(</tspan></text>
<text x="48" y="142" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">4</text>
<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">prices</tspan><tspan fill="#7c7576">:</tspan> <tspan fill="#7b7365">pd</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">Series</tspan><tspan fill="#7c7576">,</tspan></text>
<text x="48" y="164" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">5</text>
<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">period</tspan><tspan fill="#7c7576">:</tspan> <tspan fill="#7b7365">int</tspan> <tspan fill="#67513b">=</tspan> <tspan fill="#7d6c42">14</tspan><tspan fill="#7c7576">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932"><tspan fill="#7c7576">)</tspan> <tspan fill="#67513b">-&gt;</tspan> <tspan fill="#7b7365">pd</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">Series</tspan><tspan fill="#7c7576">:</tspan></text>
<text x="48" y="208" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">7</text>
<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#83633f">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
<text x="48" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">8</text>
<text x="60" y="230" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">delta</tspan> <tspan fill="#67513b">=</tspan> <tspan fill="#676161">prices</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">diff</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#7c7576">)</tspan></text>
<text x="48" y="252" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">9</text>
<text x="48" y="274" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">10</text>
<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">gain</tspan> <tspan fill="#67513b">=</tspan> <tspan fill="#676161">delta</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">clip</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#676161">lower</tspan><tspan fill="#67513b">=</tspan><tspan fill="#7d6c42">0.0</tspan><tspan fill="#7c7576">)</tspan></text>
<text x="48" y="296" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">11</text>
<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">loss</tspan> <tspan fill="#67513b">=</tspan> <tspan fill="#7c7576">(</tspan><tspan fill="#67513b">-</tspan><tspan fill="#676161">delta</tspan><tspan fill="#7c7576">)</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">clip</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#676161">lower</tspan><tspan fill="#67513b">=</tspan><tspan fill="#7d6c42">0.0</tspan><tspan fill="#7c7576">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">avg_gain</tspan> <tspan fill="#67513b">=</tspan> <tspan fill="#676161">gain</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">rolling</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#676161">period</tspan><tspan fill="#7c7576">)</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">mean</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#7c7576">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">avg_loss</tspan> <tspan fill="#67513b">=</tspan> <tspan fill="#676161">loss</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">rolling</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#676161">period</tspan><tspan fill="#7c7576">)</tspan><tspan fill="#7c7576">.</tspan><tspan fill="#7e5f3d">mean</tspan><tspan fill="#7c7576">(</tspan><tspan fill="#7c7576">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932">    <tspan fill="#676161">rs</tspan> <tspan fill="#67513b">=</tspan> <tspan fill="#676161">avg_gain</tspan> <tspan fill="#67513b">/</tspan> <tspan fill="#676161">avg_loss</tspan></text>
