<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#726b6c">Caravaggio Light — Nocturnal Bister</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#726b6c" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3932"><tspan fill="#7d6a40">import</tspan> <tspan fill="#676161">pandas</tspan> <tspan fill="#7d6a40">as</tspan> <tspan fill="#676161">pd</tspan></text>
