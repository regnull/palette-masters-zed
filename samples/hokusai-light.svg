<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#73746f" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3a35"><tspan fill="#7d7f79">)</tspan> <tspan fill="#70695c">-&gt;</tspan> <tspan fill="#856f57">pd</tspan><tspan fill="#7d7f79">.</tspan><tspan fill="#78664e">Series</tspan><tspan fill="#7d7f79">:</tspan></text>
