<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#73746f" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3a35">    <tspan fill="#686964">avg_loss</tspan> <tspan fill="#70695c">=</tspan> <tspan fill="#686964">loss</tspan><tspan fill="#7d7f79">.</tspan><tspan fill="#78664e">rolling</tspan><tspan fill="#7d7f79">(</tspan><tspan fill="#686964">period</tspan><tspan fill="#7d7f79">)</tspan><tspan fill="#7d7f79">.</tspan><tspan fill="#78664e">mean</tspan><tspan fill="#7d7f79">(</tspan><tspan fill="#7d7f79">)</tspan></text>
