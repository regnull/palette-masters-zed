<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3a35">    <tspan fill="#686964">result</tspan> <tspan fill="#70695c">=</tspan> <tspan fill="#686964">calculate_rsi</tspan><tspan fill="#7d7f79">(</tspan><tspan fill="#686964">close</tspan><tspan fill="#7d7f79">,</tspan> <tspan fill="#686964">period</tspan><tspan fill="#70695c">=</tspan><tspan fill="#7b6d52">20</tspan><tspan fill="#7d7f79">)</tspan></text>
