<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3a35">    <tspan fill="#7e513a">print</tspan><tspan fill="#7d7f79">(</tspan><tspan fill="#686964">result</tspan><tspan fill="#7d7f79">.</tspan><tspan fill="#78664e">dropna</tspan><tspan fill="#7d7f79">(</tspan><tspan fill="#7d7f79">)</tspan><tspan fill="#7d7f79">.</tspan><tspan fill="#78664e">head</tspan><tspan fill="#7d7f79">(</tspan><tspan fill="#7b6d52">5</tspan><tspan fill="#7d7f79">)</tspan><tspan fill="#7d7f79">)</tspan></text>
