<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#71706d">Munch Light — Muted Tawny</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#71706d" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3935"><tspan fill="#5e6475">import</tspan> <tspan fill="#666662">pandas</tspan> <tspan fill="#5e6475">as</tspan> <tspan fill="#666662">pd</tspan></text>
