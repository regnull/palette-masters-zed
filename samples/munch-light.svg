<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3c3935"><tspan fill="#5e6475">def</tspan> <tspan fill="#964825">calculate_rsi</tspan><tspan fill="#7c7b77">(</tspan></text>
