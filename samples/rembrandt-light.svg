<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">loss</tspan> <tspan fill="#765633">=</tspan> <tspan fill="#866c5c">(</tspan><tspan fill="#765633">-</tspan><tspan fill="#705a4d">delta</tspan><tspan fill="#866c5c">)</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">clip</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#705a4d">lower</tspan><tspan fill="#765633">=</tspan><tspan fill="#7d6c42">0.0</tspan><tspan fill="#866c5c">)</tspan></text>
<text x="48" y="318" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">12</text>
<text x="48" y="340" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">13</text>
<text x="60" y="340" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">avg_gain</tspan> <tspan fill="#765633">=</tspan> <tspan fill="#705a4d">gain</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">rolling</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#705a4d">period</tspan><tspan fill="#866c5c">)</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">mean</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#866c5c">)</tspan></text>
<text x="48" y="362" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">14</text>
<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">avg_loss</tspan> <tspan fill="#765633">=</tspan> <tspan fill="#705a4d">loss</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">rolling</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#705a4d">period</tspan><tspan fill="#866c5c">)</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">mean</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#866c5c">)</tspan></text>
<text x="48" y="384" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">15</text>
<text x="48" y="406" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">16</text>
<text x="60" y="406" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">rs</tspan> <tspan fill="#765633">=</tspan> <tspan fill="#705a4d">avg_gain</tspan> <tspan fill="#765633">/</tspan> <tspan fill="#705a4d">avg_loss</tspan></text>
