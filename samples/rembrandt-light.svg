<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">rsi</tspan> <tspan fill="#765633">=</tspan> <tspan fill="#7d6c42">100.0</tspan> <tspan fill="#765633">-</tspan> <tspan fill="#866c5c">(</tspan><tspan fill="#7d6c42">100.0</tspan> <tspan fill="#765633">/</tspan> <tspan fill="#866c5c">(</tspan><tspan fill="#7d6c42">1.0</tspan> <tspan fill="#765633">+</tspan> <tspan fill="#705a4d">rs</tspan><tspan fill="#866c5c">)</tspan><tspan fill="#866c5c">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">18</text>
<text x="48" y="472" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">19</text>
<text x="60" y="472" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#806841">return</tspan> <tspan fill="#705a4d">rsi</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">rename</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#8d6136">&quot;RSI&quot;</tspan><tspan fill="#866c5c">)</tspan></text>
<text x="48" y="494" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">20</text>
<text x="48" y="516" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">21</text>
<text x="60" y="516" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931"><tspan fill="#554b4a"># Example usage</tspan></text>
<text x="48" y="538" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">22</text>
<text x="60" y="538" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931"><tspan fill="#806841">if</tspan> <tspan fill="#826d49">__name__</tspan> <tspan fill="#765633">==</tspan> <tspan fill="#8d6136">&quot;__main__&quot;</tspan><tspan fill="#866c5c">:</tspan></text>
<text x="48" y="560" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">23</text>
<text x="60" y="560" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">data</tspan> <tspan fill="#765633">=</tspan> <tspan fill="#705a4d">pd</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">read_csv</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#8d6136">&quot;prices.csv&quot;</tspan><tspan fill="#866c5c">)</tspan></text>
<text x="48" y="582" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">24</text>
<text x="60" y="582" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">close</tspan> <tspan fill="#765633">=</tspan> <tspan fill="#705a4d">data</tspan><tspan fill="#866c5c">[</tspan><tspan fill="#8d6136">&quot;close&quot;</tspan><tspan fill="#866c5c">]</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">astype</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#765e38">float</tspan><tspan fill="#866c5c">)</tspan></text>
<text x="48" y="604" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">25</text>
<text x="60" y="604" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">result</tspan> <tspan fill="#765633">=</tspan> <tspan fill="#705a4d">calculate_rsi</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#705a4d">close</tspan><tspan fill="#866c5c">,</tspan> <tspan fill="#705a4d">period</tspan><tspan fill="#765633">=</tspan><tspan fill="#7d6c42">20</tspan><tspan fill="#866c5c">)</tspan></text>
<text x="48" y="626" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">26</text>
<text x="60" y="626" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#765e38">print</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#705a4d">result</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">dropna</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#866c5c">)</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">head</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#7d6c42">5</tspan><tspan fill="#866c5c">)</tspan><tspan fill="#866c5c">)</tspan></text>
