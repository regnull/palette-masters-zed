<text x="96" y="24" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="13" fill="#7c6455">Rembrandt Light — Shadowed Bister</text>
<text x="48" y="76" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">1</text>
<text x="60" y="76" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931"><tspan fill="#806841">import</tspan> <tspan fill="#705a4d">pandas</tspan> <tspan fill="#806841">as</tspan> <tspan fill="#705a4d">pd</tspan></text>
