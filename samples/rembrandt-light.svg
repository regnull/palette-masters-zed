<text x="60" y="120" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931"><tspan fill="#806841">def</tspan> <tspan fill="#765e38">calculate_rsi</tspan><tspan fill="#866c5c">(</tspan></text>
