<text x="60" y="142" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">prices</tspan><tspan fill="#866c5c">:</tspan> <tspan fill="#7b7364">pd</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">Series</tspan><tspan fill="#866c5c">,</tspan></text>
<text x="48" y="164" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">5</text>
<text x="60" y="164" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">period</tspan><tspan fill="#866c5c">:</tspan> <tspan fill="#7b7364">int</tspan> <tspan fill="#765633">=</tspan> <tspan fill="#7d6c42">14</tspan><tspan fill="#866c5c">,</tspan></text>
<text x="48" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">6</text>
<text x="60" y="186" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931"><tspan fill="#866c5c">)</tspan> <tspan fill="#765633">-&gt;</tspan> <tspan fill="#7b7364">pd</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">Series</tspan><tspan fill="#866c5c">:</tspan></text>
<text x="48" y="208" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">7</text>
<text x="60" y="208" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#8d6136">&quot;&quot;&quot;Compute the Relative Strength Index.&quot;&quot;&quot;</tspan></text>
<text x="48" y="230" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">8</text>
<text x="60" y="230" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">delta</tspan> <tspan fill="#765633">=</tspan> <tspan fill="#705a4d">prices</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">diff</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#866c5c">)</tspan></text>
<text x="48" y="252" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">9</text>
<text x="48" y="274" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#7c6455" text-anchor="end">10</text>
<text x="60" y="274" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#3d3931">    <tspan fill="#705a4d">gain</tspan> <tspan fill="#765633">=</tspan> <tspan fill="#705a4d">delta</tspan><tspan fill="#866c5c">.</tspan><tspan fill="#875d34">clip</tspan><tspan fill="#866c5c">(</tspan><tspan fill="#705a4d">lower</tspan><tspan fill="#765633">=</tspan><tspan fill="#7d6c42">0.0</tspan><tspan fill="#866c5c">)</tspan></text>
