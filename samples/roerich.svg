<text x="60" y="362" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#e1dedc">    <tspan fill="#bcb7b6">avg_loss</tspan> <tspan fill="#8b8170">=</tspan> <tspan fill="#bcb7b6">loss</tspan><tspan fill="#a09d9b">.</tspan><tspan fill="#b89a60">rolling</tspan><tspan fill="#a09d9b">(</tspan><tspan fill="#bcb7b6">period</tspan><tspan fill="#a09d9b">)</tspan><tspan fill="#a09d9b">.</tspan><tspan fill="#b89a60">mean</tspan><tspan fill="#a09d9b">(</tspan><tspan fill="#a09d9b">)</tspan></text>
