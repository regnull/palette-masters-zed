<text x="60" y="428" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#e1dedc">    <tspan fill="#bcb7b6">rsi</tspan> <tspan fill="#8b8170">=</tspan> <tspan fill="#c8a05a">100.0</tspan> <tspan fill="#8b8170">-</tspan> <tspan fill="#a09d9b">(</tspan><tspan fill="#c8a05a">100.0</tspan> <tspan fill="#8b8170">/</tspan> <tspan fill="#a09d9b">(</tspan><tspan fill="#c8a05a">1.0</tspan> <tspan fill="#8b8170">+</tspan> <tspan fill="#bcb7b6">rs</tspan><tspan fill="#a09d9b">)</tspan><tspan fill="#a09d9b">)</tspan></text>
<text x="48" y="450" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#a09d9b" text-anchor="end">18</text>
