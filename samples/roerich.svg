<text x="60" y="296" xml:space="preserve" font-family="'JetBrains Mono','SF Mono','Fira Code',monospace" font-size="14" fill="#e1dedc">    <tspan fill="#bcb7b6">loss</tspan> <tspan fill="#8b8170">=</tspan> <tspan fill="#a09d9b">(</tspan><tspan fill="#8b8170">-</tspan><tspan fill="#bcb7b6">delta</tspan><tspan fill="#a09d9b">)</tspan><tspan fill="#a09d9b">.</tspan><tspan fill="#b89a60">clip</tspan><tspan fill="#a09d9b">(</tspan><tspan fill="#bcb7b6">lower</tspan><tspan fill="#8b8170">=</tspan><tspan fill="#c8a05a">0.0</tspan><tspan fill="#a09d9b">)</tspan></text>
